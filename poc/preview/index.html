<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// All units are millimetres. Each bookcase: front edge at z = 0, floor of its lowest shelf at y = 0.

const LEAN_DEG = 11;
const NOT_BELOVED_RECESS = 0;    // (old always-on beloved cue, replaced by the starred view)
const CASE_GAP = 2;              // the two bookcases stand right next to each other

const data = await (await fetch('shelf.json')).json();
const cases = data.cases;        // [{name, shelves: [[book, ...], ...]}], top shelf first
const books = cases.flatMap(c => c.shelves.flat());
const tallest = Math.max(...books.map(b => b.dims.h));
// IKEA Billy (80 x 28 x 202 cm): 76 cm inside, six compartments above a plinth, white melamine.
const SHELF = { inner: data.inner, height: Math.max(300, Math.ceil(tallest + 25)), depth: 280, board: 16, plinth: 64 };
const { inner, height, depth, board, plinth } = SHELF;
const pitch = height + board;
const caseW = inner + 2 * board;
cases.forEach((c, i) => {
  c.x0 = i * (caseW + CASE_GAP);                                 // x of the case's inner left edge
  c.N = c.low ? c.shelves.length                                  // the low Billy (Lego + Hobbies) on the left
    : Math.max(6, ...cases.filter(x => !x.low).map(x => x.shelves.length));   // paired Billys: same height
  c.H = c.N * height + (c.N - 1) * board;                        // inner height, bottom floor to top underside
});
const home = cases.find(c => !c.low) ?? cases[0];               // where the camera starts (Fiction)
const baseY = (c, i) => plinth + (c.N - 1 - i) * pitch;         // floor height of shelf i (0 = top) in case c

// Debug params: ?hover=<slug> (render that book pulled out), ?case=<index>, ?y=<mm> (camera height)
const params = new URLSearchParams(location.search);

// Deterministic jitter so the shelf looks hand-placed but renders the same every time.
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const jitter = (a) => (rand() - 0.5) * 2 * a;

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(params.get('shot') ? devicePixelRatio : Math.min(devicePixelRatio, 1.5));   // ?shot: full-res stills
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
// PCF soft shadows: filtered in the main shader (no blur passes), cheap enough to update every frame.
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // re-rendered only when a book moves (see render())
let shadowsDirty = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe4e4e2);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

// ---------- materials ----------
function woodTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#a77c52'; g.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 140; i++) {
    const y = rand() * c.height, a = 0.04 + rand() * 0.08;
    g.strokeStyle = rand() > 0.5 ? `rgba(70,40,20,${a})` : `rgba(255,220,180,${a})`;
    g.lineWidth = 0.5 + rand() * 2.5;
    g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= c.width; x += 64) g.lineTo(x, y + Math.sin(x / 140 + i) * 3);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
woodTexture();   // (kept so the seeded jitter sequence below doesn't shift)
const wood = new THREE.MeshStandardMaterial({ color: 0xf3f2ee, roughness: 0.45 });      // white melamine
const woodBack = new THREE.MeshStandardMaterial({ color: 0xe8e6e0, roughness: 0.8 });   // white fibreboard back
const wall = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 });   // map + bump set below

function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}

// ---------- bookcases ----------
for (const c of cases) {
  const cx = c.x0 + inner / 2, top = plinth + c.H;
  for (let i = 0; i < c.N; i++) box(caseW, board, depth, wood, cx, baseY(c, i) - board / 2, -depth / 2);
  box(caseW, board, depth, wood, cx, top + board / 2, -depth / 2);                                  // top
  box(board, top + board, depth, wood, c.x0 - board / 2, (top + board) / 2, -depth / 2);            // left side to floor
  box(board, top + board, depth, wood, c.x0 + inner + board / 2, (top + board) / 2, -depth / 2);    // right side
  box(inner, plinth - board, board, wood, cx, (plinth - board) / 2, -12 - board / 2);               // recessed plinth front
  box(caseW, top + board, 4, woodBack, cx, (top + board) / 2, -depth - 2);                          // back panel
}
const sceneW = cases.at(-1).x0 + caseW, sceneH = Math.max(...cases.map(c => plinth + c.H + board));
// Floor: light cream carpet (dense random fibres + soft mottling), skirting board along the wall.
// Wall: very light grey with a faint plaster texture (colour noise + matching bump map).
function noiseCanvas(size, base, fibres, mottle, mottleA = 0.04, fibreA = 1) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = `rgb(${base})`; g.fillRect(0, 0, size, size);
  for (let i = 0; i < mottle; i++) {                              // large soft blotches, wrapped so the tile is seamless
    const x0 = rand() * size, y0 = rand() * size, r = 20 + rand() * 90, light = rand() < 0.5;
    for (const ox of [-size, 0, size]) for (const oy of [-size, 0, size]) {
      const x = x0 + ox, y = y0 + oy;
      if (x + r < 0 || x - r > size || y + r < 0 || y - r > size) continue;
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0, light ? `rgba(255,255,255,${mottleA})` : `rgba(0,0,0,${mottleA * 0.8})`); grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd; g.fillRect(x - r, y - r, 2 * r, 2 * r);
    }
  }
  for (let i = 0; i < fibres; i++) {                              // fine speckle / fibres
    const v = rand(); g.fillStyle = v < 0.5 ? `rgba(0,0,0,${(0.03 + rand() * 0.07) * fibreA})` : `rgba(255,255,255,${(0.05 + rand() * 0.1) * fibreA})`;
    g.fillRect(rand() * size, rand() * size, 1 + rand() * 1.5, 1 + rand() * 1.5);
  }
  return c;
}
function tiledTexture(canvas, repX, repY, srgb = true) {
  const t = new THREE.CanvasTexture(canvas);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = maxAniso; t.repeat.set(repX, repY);
  return t;
}
const FLOOR_W = sceneW + 12000, FLOOR_D = 6000, CARPET_TILE = 600, WALL_TILE = 900;
const carpetCanvas = noiseCanvas(512, '234,226,208', 90000, 60, 0.035);
const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(FLOOR_W, FLOOR_D), new THREE.MeshStandardMaterial({
  map: tiledTexture(carpetCanvas, FLOOR_W / CARPET_TILE, FLOOR_D / CARPET_TILE),
  bumpMap: tiledTexture(carpetCanvas, FLOOR_W / CARPET_TILE, FLOOR_D / CARPET_TILE, false), bumpScale: 1.2,
  roughness: 1.0 }));
floorMesh.rotation.x = -Math.PI / 2;
floorMesh.position.set(sceneW / 2, 0, -depth - 8 + FLOOR_D / 2);
floorMesh.receiveShadow = true; scene.add(floorMesh);
box(FLOOR_W, 90, 6, new THREE.MeshStandardMaterial({ color: 0xf1f0ec, roughness: 0.5 }), sceneW / 2, 45, -depth - 5);   // skirting

const plaster = noiseCanvas(512, '230,230,228', 30000, 80, 0.012, 0.5);   // very subtle
wall.map = tiledTexture(plaster, (sceneW + 12000) / WALL_TILE, 8000 / WALL_TILE);
wall.bumpMap = tiledTexture(plaster, (sceneW + 12000) / WALL_TILE, 8000 / WALL_TILE, false); wall.bumpScale = 0.35;
wall.needsUpdate = true;
const wallMesh = new THREE.Mesh(new THREE.PlaneGeometry(sceneW + 12000, 8000), wall);
wallMesh.position.set(sceneW / 2, 4000, -depth - 8); wallMesh.receiveShadow = true; scene.add(wallMesh);

// ---------- books ----------
const loader = new THREE.TextureLoader();

function averageEdgeColor(img) {
  const c = document.createElement('canvas'); c.width = 8; c.height = 64;
  const g = c.getContext('2d'); g.drawImage(img, 0, 0, 8, 64);
  const d = g.getImageData(0, 0, 1, 64).data;   // leftmost column ~ where the spine meets the cover
  let r = 0, gg = 0, b = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; gg += d[i + 1]; b += d[i + 2]; }
  const n = d.length / 4;
  return new THREE.Color(`rgb(${Math.round(r / n)},${Math.round(gg / n)},${Math.round(b / n)})`);
}

async function loadTex(url, tries = 3) {
  for (let i = 0; i < tries; i++) {
    try {
      const tex = await loader.loadAsync(url);
      tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = maxAniso;
      return tex;
    } catch (e) {
      await new Promise(r => setTimeout(r, 200 * (i + 1)));
    }
  }
  console.error('texture failed:', url);
  return null;
}

// Page edges, one canvas per book. Texture u runs across the book's thickness on the top, bottom and fore-edge
// faces, so stripes are drawn vertically. Bands are coarse and contrasty on purpose: at shelf distance a spine
// is ~2 px per mm, so real 0.1 mm page lines would average out to a flat colour. Each book gets its own paper
// tone (white to yellowed), uneven bands (signatures), a few dark gaps and some grime, so the edges look used.
// Base tones are kept well below white: the key light hits book tops directly and near-white paper clips flat.
// Every book gets its own page-edge character, drawn from wide ranges, so edges differ the way real ones do:
// paper tone (bright modern white .. cream .. yellowed pulp; kept below pure white so lit tops don't clip),
// how uneven the signatures are, how many dark gaps, fine-line density, grime near the covers, and now and then
// sprayed (coloured) edges. Most books end up subtle; a few are rough.
const SPRAYED = [[38, 36, 34], [128, 52, 44], [176, 150, 84]];   // black, muted red, gilt (no blues/purples)
function pageCanvas(t) {
  const W = Math.max(64, Math.round(t * 12)), H = 32;          // ~12 px per mm of thickness
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const age = rand() ** 1.6;                                    // 0 = new white paper, 1 = old yellowed paper
  let base = [226 - 18 * age, 222 - 30 * age, 212 - 55 * age].map(v => v + jitter(5));
  if (rand() < 0.04) base = SPRAYED[Math.floor(rand() * SPRAYED.length)];
  const [r, gg, b] = base;
  g.fillStyle = `rgb(${r},${gg},${b})`; g.fillRect(0, 0, W, H);
  const rough = rand() ** 2;                                    // most books smooth, some rough
  const bandAmp = 3 + 16 * rough, gapP = 0.08 + 0.45 * rough, gapA = 0.12 + 0.35 * rough;
  let x = 0;
  while (x < W) {                                               // signatures: bands of slightly different tone
    const bw = 3 + rand() * (16 - 10 * rough), k = jitter(bandAmp);
    g.fillStyle = `rgb(${r + k},${gg + k},${b + k})`; g.fillRect(x, 0, bw, H);
    x += bw;
    if (rand() < gapP) { g.fillStyle = `rgba(60,45,28,${gapA * (0.5 + rand())})`; g.fillRect(x, 0, 1 + rand() * 1.5, H); }
  }
  const lines = W * (0.08 + 0.3 * rand());                      // fine page lines
  for (let i = 0; i < lines; i++) {
    g.fillStyle = rand() < 0.5 ? `rgba(80,60,38,${0.06 + 0.16 * rough})` : 'rgba(255,250,240,0.25)';
    g.fillRect(rand() * W, 0, 1, H);
  }
  const grimeA = 0.25 * rand() ** 1.5;                          // handled books are darker near the covers
  const grime = g.createLinearGradient(0, 0, W, 0);
  grime.addColorStop(0, `rgba(80,60,40,${grimeA})`); grime.addColorStop(0.1 + 0.1 * rand(), 'rgba(80,60,40,0)');
  grime.addColorStop(0.85 - 0.1 * rand(), 'rgba(80,60,40,0)'); grime.addColorStop(1, `rgba(80,60,40,${grimeA})`);
  g.fillStyle = grime; g.fillRect(0, 0, W, H);
  return c;
}

function part(geo, mats, x, y, z, group) {
  const m = new THREE.Mesh(geo, mats);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; m.userData.owner = group;
  group.add(m); return m;
}

// A book is a Group (origin at its centre; spine towards +z, front cover towards +x).
//  - paperback: one block, cover flush with the pages, page edges on top / bottom / fore-edge.
//  - hardcover: 2.5 mm boards and a spine board around a page block recessed 3 mm at top, bottom and fore-edge.
// Some books get a bookmark or a slip of paper sticking out of the top.
const BOARD = 1.6, OVERHANG = 2.2;   // hardcover board thickness and how far boards stand proud of the pages (mm)
const SLIPS = [0xc23b2e, 0x2f5d8a, 0xe8e1cf, 0xd9b44a, 0x1f1f1f];
// Gold foil star sticker for starred (beloved) books.
let starredView = new URLSearchParams(location.search).get('starred') === '1';
const starMaterial = (() => {
  const S = 128, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const path = r => { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    g.lineTo(S / 2 + rr * Math.cos(a), S / 2 + rr * Math.sin(a)); } g.closePath(); };
  path(S * 0.495); g.fillStyle = '#ffffff'; g.fill();              // thin white halo: separates it from dark spines
  path(S * 0.465); g.fillStyle = '#000000'; g.fill();              // bold black outline
  path(S * 0.355);
  const grad = g.createLinearGradient(0, 0, S, S);
  grad.addColorStop(0, '#fff7b0'); grad.addColorStop(0.4, '#ffc81a'); grad.addColorStop(1, '#d88f00');
  g.fillStyle = grad; g.fill();
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.MeshStandardMaterial({ map: tex, transparent: true, alphaTest: 0.5, metalness: 0.1, roughness: 0.35,
    emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.25 });
})();
function setStarred(on) {
  starredView = on;
  for (const m of meshes) m.traverse(o => { if (o.userData.star) o.visible = on; });
  render();

}, 1500);
if (params.get('fitdebug')) {
  let worst = -1e9, over = [];
  for (const c of cases) c.shelves.forEach((sh, si) => {
    let maxX = -1e9;
    for (const b of sh) { const m = meshBySlug.get(b.slug); m.updateWorldMatrix(true, true); maxX = Math.max(maxX, new THREE.Box3().setFromObject(m).max.x); }
    const slack = c.x0 + inner - maxX; worst = Math.max(worst, -slack);
    if (slack < 0) over.push(`${c.name} shelf ${si}: ${(-slack).toFixed(1)} mm over`);
  });
  console.log('FIT ' + (over.length ? over.join('; ') : `all shelves fit (tightest has ${(-worst).toFixed(1)} mm spare)`));
}
if (params.get('leandebug')) {
  for (const slug of ['tools-for-conviviality-by-ivan-illich', 'gr-you-are-not-a-gadget', 'sid-meiers-memoir', 'frank-herbert-by-tim-oreilly', 'gr-cryptography-a-very-short-introduction']) {
    const m = meshBySlug.get(slug); m.updateWorldMatrix(true, true);
    const bb = new THREE.Box3().setFromObject(m), r = m.userData.root;
    // bottom corners of the spine face in world space
    const b = m.userData.book, t = b.dims.t, h = b.dims.h;
    const L = new THREE.Vector3(-t / 2, -h / 2, 0).applyMatrix4(m.matrixWorld), R = new THREE.Vector3(t / 2, -h / 2, 0).applyMatrix4(m.matrixWorld);
    const TL = new THREE.Vector3(-t / 2, h / 2, 0).applyMatrix4(m.matrixWorld);
    console.log(`LEAN ${slug.slice(0, 22)} pose=${b.pose} t=${t} rootPos=${r.position.x.toFixed(1)} rotZ=${(r.rotation.z * 57.3).toFixed(1)} bbX=[${bb.min.x.toFixed(1)}, ${bb.max.x.toFixed(1)}] bottomL=${L.x.toFixed(1)},${L.y.toFixed(1)} bottomR=${R.x.toFixed(1)},${R.y.toFixed(1)} topL=${TL.x.toFixed(1)}`);
  }
}
document.title = 'ready';
</script>
